<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas OCR Demo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #canvas { border: 1px solid #444; touch-action: none; }
    #textOutput { white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>

<h2>🖌️ Teken hier en haal tekst eruit!</h2>

<canvas id="canvas" width="500" height="300"></canvas>
<br>
<button id="clearBtn">Wis</button>
<button id="ocrBtn">Extract Text</button>

<h3>📝 Herkende tekst:</h3>
<div id="textOutput">Nog geen tekst herkend...</div>

<script type="module">

  import { createOCREngine } from 'https://unpkg.com/client-side-ocr@latest/dist/index.mjs';

  // Canvas setup
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  // Start drawing
  canvas.addEventListener('pointerdown', e => {
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  });

  // Draw
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  });

  // Stop drawing
  canvas.addEventListener('pointerup', () => drawing = false);
  canvas.addEventListener('pointerleave', () => drawing = false);

  // Clear canvas
  document.getElementById('clearBtn').onclick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('textOutput').innerText = "Nog geen tekst herkend...";
  };

  // OCR button
  document.getElementById('ocrBtn').onclick = async () => {
    document.getElementById('textOutput').innerText = "Bezig met herkennen...";
    
    try {
      // maak OCR engine aan
      const ocr = createOCREngine({ language: 'en' });
      await ocr.initialize();

      // haal het beeld van de canvas
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      const result = await ocr.processImage(blob);

      // toon de herkende tekst
      document.getElementById('textOutput').innerText = result.text || "(Geen tekst gevonden)";
    } catch (err) {
      document.getElementById('textOutput').innerText = "Fout bij OCR: " + err.message;
      console.error(err);
    }
  };

</script>

</body>
</html>
